# Build -> push images to ghcr.io -> deploy to the k3s cluster over Tailscale.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  NAMESPACE: workoutlog

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # No test project yet; a Release build at least catches compile errors
      - run: dotnet build backend/api/api.sln -c Release

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # TODO: add `npm run lint` once the existing lint errors are fixed
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  images:
    needs: [build-api, build-frontend]
    # PRs only run the checks; images are published from main (or a manual run)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: workoutlog-api
            context: backend/api
            target: api
          - image: workoutlog-frontend
            context: frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          # only the frontend Dockerfile declares this; the backend ignores it
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # never run two deploys against the cluster at once
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The KUBECONFIG secret holds the file base64-encoded on one line (base64 -w0)
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version

      - name: Install kustomize
        run: |
          if ! command -v kustomize >/dev/null; then
            curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
              | sudo tar -xz -C /usr/local/bin kustomize
          fi
          kustomize version

      - name: Roll out
        working-directory: k8s
        run: |
          kustomize edit set image \
            workoutlog-api=$REGISTRY/workoutlog-api:$GITHUB_SHA \
            workoutlog-frontend=$REGISTRY/workoutlog-frontend:$GITHUB_SHA
          kubectl apply -k .
          for d in workoutlog-api workoutlog-frontend; do
            kubectl -n $NAMESPACE rollout status deployment/$d --timeout=5m
          done

      - name: Show state on failure
        if: failure()
        run: |
          kubectl -n $NAMESPACE get pods -o wide || true
          kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -30 || true
