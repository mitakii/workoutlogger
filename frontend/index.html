<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#171717" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      WorkoutLogger — track your workouts, sets and strength progress
    </title>
    <meta
      name="description"
      content="WorkoutLogger is a free workout tracker. Log every session, set, rep and weight, reuse workout templates, follow your strength progress with per-exercise statistics, and compare with other lifters on the leaderboard."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WorkoutLogger" />
    <meta
      property="og:title"
      content="WorkoutLogger — track your training. See it add up."
    />
    <meta
      property="og:description"
      content="Log workouts, follow your strength over time, and pick up where you left off — every session, every set."
    />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "WorkoutLogger",
        "url": "https://app.mitakiilab.com/",
        "description": "Log workouts, track sets, reps and weight, and follow your strength progress over time."
      }
    </script>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
