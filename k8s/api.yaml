apiVersion: apps/v1
kind: Deployment
metadata:
  name: workoutlog-api
  labels:
    name: workoutlog-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: workoutlog-api
  template:
    metadata:
      labels:
        name: workoutlog-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: workoutlog-api
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: workoutlog-config
            - secretRef:
                name: workoutlog-secrets
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: workoutlog-api
spec:
  selector:
    name: workoutlog-api
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workoutlog-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      name: workoutlog-api
