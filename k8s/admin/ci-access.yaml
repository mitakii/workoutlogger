apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  namespace: workoutlog
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: workoutlog
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer
  namespace: workoutlog
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: workoutlog
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workoutlog-namespace-deployer
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [workoutlog]
    verbs: [get, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-workoutlog-namespace
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: workoutlog
roleRef:
  kind: ClusterRole
  name: workoutlog-namespace-deployer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-token
  namespace: workoutlog
  annotations:
    kubernetes.io/service-account.name: github-actions
type: kubernetes.io/service-account-token
